name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION:      eu-north-1
  ECR_REGISTRY:    336779059487.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY:  cloud-portfolio-app
  ECS_CLUSTER:     cloud-portfolio-cluster
  ECS_SERVICE:     cloud-portfolio-service
  TASK_FAMILY:     cloud-portfolio-task

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Maven project and run pytest integration tests
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: portfolio
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -psecret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build JAR with Maven (skip unit tests)
        run: mvn package -DskipTests -q

      - name: Start Spring Boot app
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/portfolio \
            --spring.datasource.username=root \
            --spring.datasource.password=secret \
            --spring.jpa.hibernate.ddl-auto=create \
          > /tmp/app.log 2>&1 &
          echo "SPRING_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for app to be ready
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/api/stocks > /dev/null; then
              echo "App is ready after $((i * 3))s"
              exit 0
            fi
            echo "  attempt $i/20 — retrying in 3s"
            sleep 3
          done
          echo "App did not start in time. Logs:"
          cat /tmp/app.log
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest integration tests
        env:
          API_BASE_URL: http://localhost:8080/api/stocks
        run: pytest tests/ -v --tb=short

      - name: Upload Spring Boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-log
          path: /tmp/app.log

      - name: Stop Spring Boot app
        if: always()
        run: kill "$SPRING_PID" || true

  # ---------------------------------------------------------------------------
  # Job 2: Build Docker image, push to ECR, redeploy ECS service
  # ---------------------------------------------------------------------------
  deploy:
    name: Build, Push & Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Authenticate to AWS using repository secrets:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # Tag with both :latest and the short git SHA so every push is traceable
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Register a new task definition revision pointing at the new image,
      # then force a new deployment of the ECS service.
      # -----------------------------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update app container image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name:  app
          image:           ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:  ${{ steps.render-task-def.outputs.task-definition }}
          cluster:          ${{ env.ECS_CLUSTER }}
          service:          ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
